name: build

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            script: build_debug.py
          - configuration: Release
            script: build_release.py
    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: pip install conan

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt', 'profiles/**') }}

      - name: Generate project files
        run: python automation/generate_project_files.py

      - name: Build ${{ matrix.configuration }}
        run: python automation/${{ matrix.script }}

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.configuration }}
          path: |
            build/bin/${{ matrix.configuration }}/Pacman.exe
            config.json

  linux:
    name: linux-${{ matrix.configuration }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            script: build_debug.py
          - configuration: Release
            script: build_release.py
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14 and Conan
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          pipx install conan

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt', 'profiles/**') }}

      - name: Generate project files
        run: python3 automation/generate_project_files.py

      - name: Build ${{ matrix.configuration }}
        run: python3 automation/${{ matrix.script }}

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: game-linux-${{ matrix.configuration }}
          path: |
            build/${{ matrix.configuration }}/bin/Pacman
            config.json

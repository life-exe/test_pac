name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: pip install conan

      - name: Generate project files
        run: python automation/generate_project_files.py

      - name: Build Debug
        run: python automation/build_debug.py

      - name: Tests under AddressSanitizer
        run: python automation/run_asan.py

      - name: Run tests
        run: python automation/run_tests.py

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y --no-progress

      - name: Measure coverage
        run: python automation/run_coverage.py --min 70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/coverage/html
        
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/test-report.xml

      - name: Publish test report
        uses: phoenix-actions/test-reporting@v10
        if: always()
        with:
          name: Test results
          path: build/test-report.xml
          reporter: java-junit
          output-to: step-summary
          fail-on-error: true

      - name: Build Release
        run: python automation/build_release.py

      - name: Check formatting
        run: python automation/format_files.py --check

      - name: Static analysis
        run: python automation/run_tidy.py

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: game-release
          path: |
            build/bin/Release/Pacman.exe
            config.json
  docs:
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: choco install doxygen.install -y --no-progress
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build documentation
        run: python automation/build_docs.py
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/site
      - name: Publish to GitHub Pages
        id: deployment
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/deploy-pages@v4
